<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
<title id="title">LectureLens product preview</title>
<desc id="desc">Bright playful interface showing lecture audio, a question, semantic search evidence, and a source timestamp.</desc>
<defs>
  <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
    <stop offset="0" stop-color="#FFF8EE"/>
    <stop offset=".55" stop-color="#F7ECFF"/>
    <stop offset="1" stop-color="#EAFBFF"/>
  </linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#17171b" flood-opacity=".12"/>
  </filter>
</defs>
<rect width="1200" height="630" rx="36" fill="url(#bg)"/>
<g opacity=".18" fill="#17171b">
  <circle cx="65" cy="70" r="2"/><circle cx="95" cy="70" r="2"/><circle cx="125" cy="70" r="2"/>
  <circle cx="65" cy="100" r="2"/><circle cx="95" cy="100" r="2"/><circle cx="125" cy="100" r="2"/>
</g>
<rect x="70" y="60" width="58" height="58" rx="16" fill="#8B5CF6"/>
<path d="M84 89c4-8 9-12 15-12s11 4 15 12c-4 9-9 13-15 13s-11-4-15-13Z" fill="#fff"/>
<circle cx="99" cy="89" r="6" fill="#FFD84D"/>
<text x="146" y="99" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#17171b">LectureLens</text>

<text x="72" y="205" font-family="Arial, sans-serif" font-size="58" font-weight="800" fill="#17171b">Don’t replay the whole</text>
<text x="72" y="268" font-family="Arial, sans-serif" font-size="58" font-weight="800" fill="#17171b">lecture for one answer.</text>
<rect x="72" y="286" width="430" height="16" rx="8" fill="#FFD84D"/>
<text x="74" y="344" font-family="Arial, sans-serif" font-size="22" fill="#6D7180">Record → ask → find → jump back to the source.</text>

<g filter="url(#shadow)">
  <rect x="650" y="78" width="420" height="205" rx="26" fill="#fff" stroke="#E9E4DC"/>
  <text x="680" y="112" font-family="monospace" font-size="13" fill="#8B5CF6">CS 101 · TODAY</text>
  <g fill="#8B5CF6">
    <rect x="680" y="148" width="8" height="62" rx="4"/><rect x="696" y="136" width="8" height="86" rx="4"/>
    <rect x="712" y="157" width="8" height="44" rx="4"/><rect x="728" y="126" width="8" height="106" rx="4"/>
    <rect x="744" y="144" width="8" height="70" rx="4"/><rect x="760" y="118" width="8" height="122" rx="4"/>
    <rect x="776" y="152" width="8" height="54" rx="4"/><rect x="792" y="132" width="8" height="94" rx="4"/>
    <rect x="808" y="160" width="8" height="38" rx="4"/><rect x="824" y="140" width="8" height="78" rx="4"/>
  </g>
  <circle cx="690" cy="248" r="16" fill="#17171b"/>
  <polygon points="686,241 686,255 697,248" fill="#fff"/>
  <text x="716" y="252" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#17171b">Recursion &amp; call stack</text>
</g>

<g filter="url(#shadow)">
  <rect x="720" y="306" width="390" height="108" rx="22" fill="#fff" stroke="#E9E4DC"/>
  <text x="746" y="336" font-family="monospace" font-size="12" fill="#8B5CF6">ASK THE LECTURE</text>
  <text x="746" y="372" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#17171b">What is a base case?</text>
</g>

<g filter="url(#shadow)">
  <rect x="610" y="440" width="470" height="120" rx="22" fill="#fff" stroke="#E9E4DC"/>
  <circle cx="646" cy="476" r="14" fill="#FFD84D"/>
  <text x="672" y="482" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#17171b">A base case tells recursion when to stop.</text>
  <rect x="672" y="510" width="146" height="32" rx="10" fill="#FFD84D"/>
  <text x="690" y="531" font-family="monospace" font-size="13" font-weight="700" fill="#17171b">Source · 24:18 ↗</text>
</g>

<g transform="translate(92 424) rotate(-5)">
  <rect width="170" height="54" fill="#43D9A3" stroke="#17171b" stroke-width="2"/>
  <text x="22" y="34" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#17171b">caught it ✌</text>
</g>

<g transform="translate(280 490) rotate(4)">
  <rect width="190" height="54" fill="#FFD9E0" stroke="#17171b" stroke-width="2"/>
  <text x="23" y="34" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#17171b">52 min → 8 sec</text>
</g>
</svg>