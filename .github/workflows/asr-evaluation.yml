name: Evaluate ASR WER

on:
  push:
    branches: ["main"]
    paths:
      - "evaluation/asr_evaluate.py"
      - "evaluation/asr_requirements.txt"
      - ".github/workflows/asr-evaluation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  asr-benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: evaluation/asr_requirements.txt

      - name: Install ASR benchmark dependencies
        run: python -m pip install -r evaluation/asr_requirements.txt

      - name: Run real-audio WER benchmark
        run: python evaluation/asr_evaluate.py

      - name: Publish ASR benchmark summary
        run: |
          echo "## LectureLens ASR benchmark" >> "$GITHUB_STEP_SUMMARY"
          echo "This is a real-audio regression benchmark on read English speech, not a classroom-lecture benchmark." >> "$GITHUB_STEP_SUMMARY"
          cat evaluation/asr_results.json >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: lecturelens-asr-results
          path: evaluation/asr_results.json
