name: Evaluate retrieval

on:
  push:
    branches: ["main"]
    paths:
      - "evaluation/**"
      - ".github/workflows/evaluation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: evaluation/requirements.txt
      - run: python -m pip install -r evaluation/requirements.txt
      - run: python evaluation/evaluate.py
      - name: Publish benchmark summary
        run: |
          echo "## LectureLens retrieval benchmark" >> "$GITHUB_STEP_SUMMARY"
          cat evaluation/results.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v5
        with:
          name: lecturelens-evaluation-results
          path: evaluation/results.json
